<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Barrio Seguro SPS</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1a237e">
  <link rel="icon" href="icons/icon-192.png">
</head>
<body>
  <div class="landing">
    <div class="landing-logo">🛡️</div>
    <h1>Barrio Seguro SPS</h1>
    <p class="subtitle">Seguridad comunitaria para San Pedro Sula</p>

    <div class="landing-cards">
      <a href="/denuncia.html" class="landing-card denuncia">
        <span class="icono">🚨</span>
        <h2>Hacer una Denuncia</h2>
        <p>Reporta un incidente o envía una alerta silenciosa. Requiere iniciar sesión.</p>
      </a>
      <a href="/monitor.html" class="landing-card monitor">
        <span class="icono">🗺️</span>
        <h2>Panel de Monitoreo</h2>
        <p>Visualiza en tiempo real el mapa de denuncias y alertas activas.</p>
      </a>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
