<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Barrio Seguro SPS</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1a237e">
  <link rel="icon" href="icons/icon-192.png">
</head>
<body>
  <header>
    <div class="header-top">
      <h1>Barrio Seguro SPS</h1>
      <div class="role-selector">
        <button id="btnVecino" class="active">Vecino</button>
        <button id="btnMonitor">Monitor</button>
      </div>
    </div>
    <div id="weather-widget" class="weather-widget" title="Actualizar clima">
      <span id="weather-icon">☀️</span>
      <span id="weather-text">San Pedro Sula - 32°C, soleado</span>
    </div>
    <nav id="main-nav">
      <button class="tab active" data-tab="mapa">Mapa de Calor</button>
      <button class="tab" data-tab="contactos">Mis Contactos</button>
      <button class="tab" data-tab="recursos">Recursos</button>
      <button class="tab" data-tab="monitor" id="tabMonitor" style="display:none;">Monitor</button>
    </nav>
  </header>

  <main>
    <section id="tab-mapa" class="tab-content active">
      <div class="map-filters">
        <label><input type="checkbox" class="filter-cat" value="Robo/Asalto" checked> Robo/Asalto</label>
        <label><input type="checkbox" class="filter-cat" value="Vehículo Sospechoso" checked> Vehículo Sospechoso</label>
        <label id="labelViolencia" style="display:none;"><input type="checkbox" class="filter-cat" value="Violencia Doméstica"> Violencia Doméstica</label>
      </div>
      <div id="map"></div>
      <button id="btn-reportar-incidente" class="btn-report">+ Reportar Incidente</button>
    </section>

    <section id="tab-contactos" class="tab-content">
      <h2>Círculo de Confianza</h2>
      <div id="lista-contactos"></div>
      <form id="form-contacto" class="form">
        <h3>Agregar Contacto</h3>
        <input type="text" id="contacto-nombre" placeholder="Nombre" required>
        <input type="tel" id="contacto-telefono" placeholder="Teléfono" required>
        <input type="text" id="contacto-relacion" placeholder="Relación (vecino, familiar)" required>
        <button type="submit">Agregar</button>
      </form>
      <button id="btn-simular-alerta" class="btn-alert-sim">Simular Alerta Silenciosa (Demo)</button>
    </section>

    <section id="tab-recursos" class="tab-content">
      <h2>Directorio de Recursos</h2>
      <div id="lista-recursos"></div>
      <div id="form-recurso-container" style="display:none;">
        <form id="form-recurso" class="form">
          <h3>Agregar Recurso (Monitor)</h3>
          <input type="text" id="recurso-nombre" placeholder="Nombre" required>
          <select id="recurso-tipo" required>
            <option value="">Tipo</option>
            <option value="policia">Policía</option>
            <option value="hospital">Hospital</option>
            <option value="refugio">Refugio</option>
          </select>
          <input type="text" id="recurso-direccion" placeholder="Dirección" required>
          <input type="tel" id="recurso-telefono" placeholder="Teléfono" required>
          <input type="text" id="recurso-horario" placeholder="Horario" required>
          <button type="submit">Agregar Recurso</button>
        </form>
      </div>
    </section>

    <section id="tab-monitor" class="tab-content">
      <h2>Panel de Monitoreo</h2>
      <div id="alertas-activas"></div>
      <hr>
      <h3>Incidentes de Violencia Doméstica</h3>
      <div id="incidentes-violencia"></div>
    </section>

    <div id="toast-container" class="toast-container"></div>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
