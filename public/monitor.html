<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Monitoreo - Barrio Seguro SPS</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#283593">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
</head>
<body>
  <header class="app-header" style="background:#283593;">
    <div class="titulo-con-logo">
      <img src="icons/icon-192.png" alt="" class="header-logo-img">
      <div class="titulo">
        Panel de Monitoreo
        <small>Denuncias y alertas en tiempo real</small>
      </div>
    </div>
    <a href="/index.html" style="color:white;text-decoration:none;font-size:0.85rem;">← Inicio</a>
  </header>

  <nav id="main-nav" style="display:flex;background:#1a237e;">
    <button class="tab active" data-tab="mapa">Mapa</button>
    <button class="tab" data-tab="reportes">Denuncias</button>
    <button class="tab" data-tab="alertas">Alertas Activas</button>
    <button class="tab" data-tab="recursos">Recursos</button>
  </nav>

  <main>
    <section id="tab-mapa" class="tab-content active">
      <div class="map-filters" style="padding:10px 10px 0;">
        <label><input type="checkbox" class="filter-cat" value="Robo/Asalto" checked> 🚨 Robo/Asalto</label>
        <label><input type="checkbox" class="filter-cat" value="Vehículo Sospechoso" checked> 🚗 Vehículo Sospechoso</label>
        <label><input type="checkbox" class="filter-cat" value="Violencia Doméstica" checked> 🆘 Violencia Doméstica</label>
      </div>
      <div id="map" style="height:60vh;margin:10px;width:calc(100% - 20px);border-radius:10px;border:2px solid #ccc;"></div>
    </section>

    <section id="tab-reportes" class="tab-content">
      <div class="reportes-header">
        <h2>📋 Denuncias recibidas <span id="conteo-reportes" class="badge-count">0</span></h2>
        <div class="reportes-filtros">
          <button class="pill-filtro activo" data-filtro="todas">Todas</button>
          <button class="pill-filtro" data-filtro="Robo/Asalto">🚨 Robo/Asalto</button>
          <button class="pill-filtro" data-filtro="Vehículo Sospechoso">🚗 Vehículo Sospechoso</button>
          <button class="pill-filtro" data-filtro="Violencia Doméstica">🆘 Violencia Doméstica</button>
        </div>
      </div>
      <div id="lista-reportes" class="lista-reportes"></div>
    </section>

    <section id="tab-alertas" class="tab-content">
      <div class="seccion">
        <h2>🆘 Alertas Silenciosas Activas <span id="conteo-alertas" class="badge-count">0</span></h2>
        <div id="alertas-activas"></div>
      </div>
      <div class="seccion">
        <h3>Incidentes de Violencia Doméstica (confidencial)</h3>
        <div id="incidentes-violencia"></div>
      </div>
    </section>

    <section id="tab-recursos" class="tab-content">
      <div class="seccion">
        <h2>Directorio de Recursos</h2>
        <div id="lista-recursos"></div>
      </div>
      <div class="seccion">
        <h3>Agregar Recurso</h3>
        <form id="form-recurso" class="form" style="box-shadow:none;padding:0;">
          <input type="text" id="recurso-nombre" placeholder="Nombre" required>
          <select id="recurso-tipo" required>
            <option value="">Tipo</option>
            <option value="policia">Policía</option>
            <option value="hospital">Hospital</option>
            <option value="refugio">Refugio</option>
          </select>
          <input type="text" id="recurso-direccion" placeholder="Dirección" required>
          <input type="tel" id="recurso-telefono" placeholder="Teléfono" required>
          <input type="text" id="recurso-horario" placeholder="Horario" required>
          <button type="submit">Agregar Recurso</button>
        </form>
      </div>
    </section>

    <div id="toast-container" class="toast-container"></div>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/monitor.js"></script>
</body>
</html>
